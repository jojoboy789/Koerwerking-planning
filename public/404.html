<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17202b">
  <title>Pagina niet gevonden | Koerwerking-planning</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #17202b; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 520px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 24px; background: white; box-shadow: 0 20px 60px rgb(15 23 42 / 12%); }
    .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 14px; background: #17202b; color: #ffdc00; font-size: 25px; font-weight: 800; }
    h1 { margin: 20px 0 8px; font-size: 24px; }
    p { color: #475569; line-height: 1.6; }
    a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 12px; background: #ffdc00; color: #17202b; font-weight: 750; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">!</div>
    <h1>Pagina niet gevonden</h1>
    <p>Deze pagina of dit bestand bestaat niet meer. Ga terug naar Koerwerking-planning en probeer opnieuw.</p>
    <a href="/">Terug naar de planning</a>
  </main>
</body>
</html>
